<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>羅生門 ～生きるための選択～</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    font-family:"Yu Gothic","Meiryo",sans-serif;
}

#background{
    width:100vw;
    height:100vh;

    background-image:url("image.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:flex-end;
}

#titleScreen{

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.75);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;

    z-index:9999;
}

#titleScreen h1{
    font-size:72px;
    color:#FFD700;
    margin:0;
}

#titleScreen h2{
    margin-bottom:40px;
}

#startButton{
    padding:15px 60px;
    font-size:24px;
    cursor:pointer;
}

#textbox{
    width:95%;
    max-width:1300px;
    margin-bottom:20px;
    background:rgba(0,0,0,.6);
    border-radius:12px;
    padding:20px;
    display:flex;
    gap:20px;
}

#characterArea{

    width:300px;

    display:flex;
    justify-content:center;
    align-items:flex-end;
}

#character{

    max-height:450px;

    object-fit:contain;
}

#messageArea{

    flex:1;

    color:white;
}

#speaker{

    font-size:28px;

    color:#FFD700;

    margin-bottom:15px;
}

#text{

    min-height:140px;

    font-size:30px;

    line-height:1.8;
}

#choices{

    margin-top:15px;
}

.choiceBtn{

    width:100%;

    padding:15px;

    margin-bottom:10px;

    font-size:20px;

    cursor:pointer;
}

#controls{

    text-align:right;
}

#nextBtn{

    padding:12px 25px;

    font-size:20px;

    cursor:pointer;
}

@media screen and (max-width:768px){

body{
    overflow:auto;
}

#titleScreen h1{
    font-size:42px;
}

#titleScreen h2{
    font-size:22px;
}

#startButton{
    font-size:20px;
}

#background{
    align-items:flex-start;
}

#textbox{
    margin-top:10px;
    margin-bottom:10px;
}

#textbox{
    flex-direction:column;
    align-items:center;
}

#characterArea{
    width:100%;
    display:flex;
    justify-content:center;
}

#character{
    max-height:240px;
}

#messageArea{
    width:100%;
}

#speaker{
    font-size:22px;
}

#text{
    font-size:22px;
    line-height:1.6;
}

}


</style>
</head>

<body>

<div id="titleScreen">

<h1>羅生門</h1>

<h2>～生きるための選択～</h2>

<button id="startButton">
ゲーム開始
</button>

</div>

<div id="background">

<div id="textbox">

<div id="characterArea">

<img
id="character"
src="下人風貌改.png"
alt="下人">

</div>

<div id="messageArea">

<div id="speaker"></div>

<div id="text"></div>

<div id="choices"></div>

<div id="controls">

<button id="nextBtn">
▶ 次へ
</button>

</div>

</div>

</div>

</div>

<script>

const story = [

{
speaker:"語り",
text:"夕暮れの羅生門。雨が降っている。"
},

{
speaker:"語り",
text:"京都は災害と飢饉によって荒れ果てていた。"
},

{
speaker:"語り",
text:"下人は主人に暇を出され、行き場を失っていた。"
},

{
speaker:"下人",
text:"雨は止みそうにないな……。"
},

{
speaker:"下人",
text:"主人にも追い出された。"
},

{
speaker:"下人",
text:"このままでは飢え死にだ。"
},

{
choice:true,

choices:[

{
text:"主人の家へ戻ることを考える",
next:"bad_home"
},

{
text:"新しい仕事を探すことを考える",
next:"bad_job"
},

{
text:"生きるためなら盗人になることを考える",
next:7
}

]

},

{
speaker:"下人",
text:"どうにもならないことを、どうにかしなければならない。"
},

{
speaker:"語り",
text:"夜が近づいている。"
},

{
speaker:"下人",
text:"あそこに楼へ上るはしごがある。"
},

{
speaker:"下人",
text:"今夜だけでも眠れる場所が必要だ。"
},

{
choice:true,

choices:[

{
text:"上に登る",
next:13
},

{
text:"ここに留まる",
next:"stay"
}

]

},

{
speaker:"語り",
text:"下人は静かにはしごを登る。"
},

{
speaker:"下人",
text:"誰かいるのか……？"
},

{
speaker:"下人",
text:"こんな場所に？"
},

{
speaker:"語り",
text:"ガサ……"
},

{
speaker:"下人",
text:"さらに近づいてみよう。"
},

{
speaker:"語り",
text:"楼の中には数え切れない死体が転がっていた。"
},

{
speaker:"下人",
text:"死体だらけだ……。"
},

{
speaker:"下人",
text:"あれは何をしている？"
},

{
speaker:"語り",
text:"老婆が死人の髪を抜いている。"
},

{
speaker:"下人",
text:"死人の髪を抜いているだと……！"
},

{
speaker:"下人",
text:"なんという悪だ！"
},

{
choice:true,

choices:[

{
text:"老婆を問い詰める",
next:25
},

{
text:"見逃す",
next:"bad1"
}

]

},

{
speaker:"下人",
text:"おのれ！何をしていた！"
},

{
speaker:"老婆",
text:"ひっ！"
},

{
speaker:"下人",
text:"言え。何のために死体の髪を抜く？"
},

{
speaker:"老婆",
text:"その髪でかつらを作るのじゃ。"
},

{
speaker:"下人",
text:"それだけのために？"
},

{
speaker:"老婆",
text:"生きるためじゃ。"
},

{
speaker:"老婆",
text:"今髪を抜いた女も善人ではない。"
},

{
speaker:"老婆",
text:"蛇を魚と偽って売っていた。"
},

{
speaker:"老婆",
text:"生きるためにのう。"
},

{
speaker:"下人",
text:"……。"
},

{
speaker:"老婆",
text:"飢え死にせぬためには仕方なかった。"
},

{
speaker:"老婆",
text:"わしも同じじゃ。"
},

{
speaker:"老婆",
text:"生きるためじゃ。"
},

{
speaker:"語り",
text:"老婆の言葉が、下人の心に深く入り込む。"
},

{
speaker:"下人",
text:"生きるためなら……。"
},

{
speaker:"下人",
text:"悪も許されるのか。"
},

{
choice:true,

choices:[
{
text:"老婆を許す",
next:"bad2"
},
{
text:"老婆を役人へ突き出す",
next:"bad3"
},
{
text:"自分も生きるために行動する",
next:"true1"
}
]

}

];

const speaker=document.getElementById("speaker");
const text=document.getElementById("text");
const choices=document.getElementById("choices");
const nextBtn=document.getElementById("nextBtn");
const character=document.getElementById("character");
const background=document.getElementById("background");

let current=0;

function showLine(){

character.style.display="block";

background.style.backgroundColor="";

choices.innerHTML="";

const line=story[current];

if(current <= 12){

background.style.backgroundImage='url("image.png")';

}

else if(current >= 13 && current <= 17){

background.style.backgroundImage='url("はしご.png")';

}

else{

background.style.backgroundImage='url("楼内.png")';

}

if(line.choice){

showChoices(line);
return;

}

speaker.textContent=line.speaker;
text.textContent=line.text;

if(line.speaker==="老婆"){

    character.src="老婆.png";

}else{

    character.src="下人風貌改.png";

}

nextBtn.style.display="inline-block";

}

function showChoices(line){

speaker.textContent="";
text.textContent="どうする？";

choices.innerHTML="";

nextBtn.style.display="none";

line.choices.forEach(choice=>{

const btn=document.createElement("button");

btn.className="choiceBtn";

btn.textContent=choice.text;

btn.onclick=()=>{

handleChoice(choice.next);

};

choices.appendChild(btn);

});

}

function handleChoice(next){

if(next==="bad_home"){

showBadEnd(
"主人への未練",
"主人の家へ戻ったが、追い返されてしまった。下人は雨の中で飢え死にした。"
);

return;

}

if(next==="bad_job"){

showBadEnd(
"甘い希望",
"仕事を探して歩き回ったが、この世は既に荒れ果てていた。下人は力尽きた。"
);

return;

}

if(next==="stay"){

speaker.textContent="下人";

text.textContent=
"いや、このままでは寒さに耐えられない。";

choices.innerHTML="";

const btn=document.createElement("button");

btn.className="choiceBtn";

btn.textContent="上へ登る";

btn.onclick=()=>{

current=13;
showLine();

};

choices.appendChild(btn);

return;

}

if(next==="bad1"){

showBadEnd(
"臆病者の末路",
"そのまま俺は飢え死にしてしまった。"
);

return;

}

if(next==="bad2"){

showBadEnd(
"正しいこと",
"だが俺はどうやって生きる？"
);

return;

}

if(next==="bad3"){

showBadEnd(
"正義",
"老婆を役人に突き出したが、下人は飢え死にした。"
);

return;

}

if(next==="true1"){

showTrueRoute();

return;

}

current=next;

showLine();

}

function showBadEnd(title,message){

background.style.backgroundImage="none";
background.style.backgroundColor="black";

speaker.textContent="BAD END";

text.innerHTML=
`<b>${title}</b><br><br>${message}`;

choices.innerHTML="";

nextBtn.style.display="none";

const btn=document.createElement("button");

btn.className="choiceBtn";

btn.textContent="タイトルへ戻る";

btn.onclick=()=>location.reload();

choices.appendChild(btn);

}

function showTrueRoute(){

speaker.textContent="下人";

text.textContent=
"ならば、恨むなよ。";

choices.innerHTML="";

nextBtn.style.display="none";

const btn=document.createElement("button");

btn.className="choiceBtn";

btn.textContent="次へ";

btn.onclick=showTrueRoute2;

choices.appendChild(btn);

}

function showTrueRoute2(){

speaker.textContent="下人";

text.textContent=
"俺も生きるためだ。";

choices.innerHTML="";

const btn=document.createElement("button");

btn.className="choiceBtn";

btn.textContent="次へ";

btn.onclick=showTrueRoute3;

choices.appendChild(btn);

}

function showTrueRoute3(){

character.src="老婆.png";

speaker.textContent="老婆";

text.textContent=
"な、何を……！";

choices.innerHTML="";

const btn=document.createElement("button");

btn.className="choiceBtn";

btn.textContent="次へ";

btn.onclick=showTrueRoute4;

choices.appendChild(btn);

}

function showTrueRoute4(){

speaker.textContent="語り";

text.textContent="ガッ！";

choices.innerHTML="";

const btn=document.createElement("button");

btn.className="choiceBtn";

btn.textContent="次へ";

btn.onclick=showTrueRoute5;

choices.appendChild(btn);

}

function showTrueRoute5(){

speaker.textContent="語り";

text.textContent=
"下人は老婆の着物をはぎ取った。";

choices.innerHTML="";

const btn=document.createElement("button");

btn.className="choiceBtn";

btn.textContent="次へ";

btn.onclick=showTrueRoute6;

choices.appendChild(btn);

}

function showTrueRoute6(){

speaker.textContent="下人";

text.textContent=
"飢え死にするわけにはいかない。";

choices.innerHTML="";

const btn=document.createElement("button");

btn.className="choiceBtn";

btn.textContent="エンディングへ";

btn.onclick=showEnding;

choices.appendChild(btn);

}

function showEnding(){

background.style.backgroundImage='url("trueend.png")';

character.style.display="none";

speaker.textContent="TRUE END";

text.innerHTML=`

<b>羅生門</b>

<br><br>

下人は着物を抱え、
闇の中へ駆け去った。

<br><br>

かつて盗人になることを
ためらっていた男は、

生きるために悪へと
踏み出したのである。

<br><br>

羅生門の下には
ただ黒々とした夜が広がっていた。

`;

choices.innerHTML="";

nextBtn.style.display="none";

const btn=document.createElement("button");

btn.className="choiceBtn";

btn.textContent="もう一度遊ぶ";

btn.onclick=()=>location.reload();

choices.appendChild(btn);

}

nextBtn.addEventListener("click",()=>{

current++;

if(current>=story.length){
showEnding();
return;
}

showLine();

});

document.getElementById("startButton")
.addEventListener("click",()=>{

document.getElementById("titleScreen")
.style.display="none";

showLine();

});

</script>

</body>
</html>
